name: Test

# A push to staging BUILDS and publishes images but does NOT deploy them.
# Deploying is an explicit manual run from the Actions tab.
#
# The test instance is normally STOPPED to save cost, so a deploy here starts
# with someone starting it. That is also why deploying is manual rather than
# automatic: a push would otherwise fail against a box that is switched off.
#
# AT CUTOVER: delete the `if:` on the deploy job.
on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="${REGISTRY}/${owner}/ticketing-saas"
          echo "backend_image=${base}-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${base}-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Assert the frontend build args are present
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: ./deploy/render-env.sh frontend/.env.example > /dev/null

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy to test
    needs: build
    runs-on: ubuntu-latest
    # DELETE THIS LINE AT CUTOVER.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Render backend.env
        env:
          # EVERY key in backend/.env.example must appear here, or the build
          # fails. See render-env.sh for why that matters on this project.
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          ENVIRONMENT: test
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          MANAGER_EMAIL: ${{ vars.MANAGER_EMAIL }}
        run: ./deploy/render-env.sh backend/.env.example > /tmp/backend.env

      - name: Assemble the stack directory
        run: |
          mkdir -p /tmp/stack
          cp -r deploy/. /tmp/stack/
          cp -r proxy/deploy/conf.d /tmp/stack/proxy-templates
          mv /tmp/backend.env /tmp/stack/backend.env
          cat > /tmp/stack/stack.env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER_TEST }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_TEST }}
          CRM_DB_PASSWORD=${{ secrets.CRM_DB_PASSWORD_TEST }}
          BACKEND_IMAGE=${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE=${{ needs.build.outputs.frontend_image }}
          EOF
          chmod +x /tmp/stack/*.sh /tmp/stack/postgres-init/*.sh

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Copy the stack to the box
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_TEST }} "mkdir -p ~/stack"
          scp -o StrictHostKeyChecking=no -r /tmp/stack/. \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_TEST }}:~/stack/

      # A SEPARATE STEP, AND IT HAS TO STAY ONE.
      #
      # Installs Docker if the box has none. It cannot be chained ahead of the
      # docker login below, because bootstrap.sh adds the deploy user to the
      # `docker` group and group membership is resolved at login -- the session
      # that ran usermod does not have it. Same ssh call would install Docker
      # and then fail on the socket. A new step is a new session.
      - name: Prepare the box
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_TEST }} "
            bash ~/stack/bootstrap.sh '${{ vars.EC2_USER }}'
          "

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_TEST }} "
            set -e
            echo '${{ secrets.GHCR_PULL_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            API_DOMAIN=\$(echo '${{ vars.VITE_API_URL }}' | sed -E 's#^https?://##; s#/.*##')
            bash ~/stack/deploy.sh '${{ vars.TEST_DOMAIN }}' \"\$API_DOMAIN\" '${{ vars.CERTBOT_EMAIL }}'
          "

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ vars.TEST_DOMAIN }}/health"; then
              echo " <- test healthy"; exit 0
            fi
            sleep 6
          done
          echo "health check never passed" >&2; exit 1
