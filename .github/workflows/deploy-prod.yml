name: Prod

# A push to main BUILDS and publishes images but does NOT deploy them.
#
# That is deliberate while the box still runs the bare-metal stack: this branch
# can merge, and images can sit ready to pull, without anything on the server
# changing. Deploying is an explicit manual run from the Actions tab.
#
# AT CUTOVER: delete the `if:` on the deploy job so a push to main deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR rejects uppercase in a repository path and this owner is mixed
          # case.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="${REGISTRY}/${owner}/ticketing-saas"
          # Tagged by commit SHA rather than :latest, so a deploy names exactly
          # one immutable image and a rollback is redeploying an older tag --
          # not hoping a moving tag still points where it did.
          echo "backend_image=${base}-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${base}-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Assert the frontend build args are present
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.PROD_CLERK_PUBLISHABLE_KEY }}
        run: |
          # VITE_ variables are inlined at BUILD time. A missing one becomes an
          # empty string with no error and ships an app nobody can log into, so
          # it is caught here rather than in a browser.
          ./deploy/render-env.sh frontend/.env.example > /dev/null

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          # INSTALL_DEV stays false, so pytest never reaches the server.

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.PROD_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy to prod
    needs: build
    runs-on: ubuntu-latest
    # DELETE THIS LINE AT CUTOVER to let a push to main deploy.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Render backend.env
        env:
          # EVERY key in backend/.env.example must appear here. render-env.sh
          # fails the build if one does not -- which is the entire point: the
          # old heredoc shipped an empty value and said nothing.
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          CLERK_SECRET_KEY: ${{ secrets.PROD_CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API: ${{ secrets.PROD_CLERK_FRONTEND_API }}
          ENVIRONMENT: prod
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          MANAGER_EMAIL: ${{ vars.MANAGER_EMAIL }}
        run: ./deploy/render-env.sh backend/.env.example > /tmp/backend.env

      - name: Assemble the stack directory
        run: |
          mkdir -p /tmp/stack
          cp -r deploy/. /tmp/stack/
          # Proxy server-block templates. deploy.sh substitutes the hostnames
          # and decides whether the SSL blocks can be installed yet.
          cp -r proxy/deploy/conf.d /tmp/stack/proxy-templates
          mv /tmp/backend.env /tmp/stack/backend.env
          cat > /tmp/stack/stack.env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER_PROD }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_PROD }}
          CRM_DB_PASSWORD=${{ secrets.CRM_DB_PASSWORD_PROD }}
          BACKEND_IMAGE=${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE=${{ needs.build.outputs.frontend_image }}
          EOF
          chmod +x /tmp/stack/*.sh /tmp/stack/postgres-init/*.sh

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Copy the stack to the box
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }} "mkdir -p ~/stack"
          scp -o StrictHostKeyChecking=no -r /tmp/stack/. \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }}:~/stack/

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }} "
            set -e
            # A read-only token: this box pulls images, it never publishes them.
            echo '${{ secrets.GHCR_PULL_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            API_DOMAIN=\$(echo '${{ vars.PROD_API_URL }}' | sed -E 's#^https?://##; s#/.*##')
            bash ~/stack/deploy.sh '${{ vars.PROD_DOMAIN }}' \"\$API_DOMAIN\" '${{ vars.CERTBOT_EMAIL }}'
          "

      - name: Smoke test
        run: |
          # Through the real hostname, so this exercises Cloudflare, the proxy
          # and the backend rather than proving a container merely started.
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ vars.PROD_DOMAIN }}/health"; then
              echo " <- prod healthy"; exit 0
            fi
            sleep 6
          done
          echo "health check never passed" >&2; exit 1
