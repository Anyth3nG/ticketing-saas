name: Prod

# A push to main BUILDS and publishes images but does NOT deploy them.
#
# That is deliberate while the box still runs the bare-metal stack: this branch
# can merge, and images can sit ready to pull, without anything on the server
# changing. Deploying is an explicit manual run from the Actions tab.
#
# AT CUTOVER: delete the `if:` on the deploy job so a push to main deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    # Every per-environment secret and variable now lives INSIDE this
    # GitHub Environment, and a job only sees those if it names the
    # environment. Without this line they resolve to an empty string --
    # no error, no warning. That is how a prod deploy came to run
    # `aws s3 sync ... s3://` and `scp ubuntu@:` on 2026-09-06.
    #
    # The BUILD job needs it as much as the deploy: it reads the Clerk
    # publishable key, which Vite inlines at build time. Miss it here and
    # the build stays green while shipping a bundle nobody can log into.
    environment: prod
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR rejects uppercase in a repository path and this owner is mixed
          # case.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="${REGISTRY}/${owner}/ticketing-saas"
          # Tagged by commit SHA rather than :latest, so a deploy names exactly
          # one immutable image and a rollback is redeploying an older tag --
          # not hoping a moving tag still points where it did.
          echo "backend_image=${base}-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${base}-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Assert the frontend build args are present
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.PROD_CLERK_PUBLISHABLE_KEY }}
        run: |
          # VITE_ variables are inlined at BUILD time. A missing one becomes an
          # empty string with no error and ships an app nobody can log into, so
          # it is caught here rather than in a browser.
          ./deploy/render-env.sh frontend/.env.example > /dev/null

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          # INSTALL_DEV stays false, so pytest never reaches the server.

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.PROD_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy to prod
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    # DELETE THIS LINE AT CUTOVER to let a push to main deploy.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Render backend.env
        env:
          # EVERY key in backend/.env.example must appear here. render-env.sh
          # fails the build if one does not -- which is the entire point: the
          # old heredoc shipped an empty value and said nothing.
          # DATABASE_URL is BUILT from the same two secrets that create the
          # database, never stored as a URL of its own. It used to be
          # secrets.DATABASE_URL_PROD, which carried a second copy of the role
          # and password that POSTGRES_USER_PROD/POSTGRES_PASSWORD_PROD already
          # supply -- and two copies of one credential duly drifted apart. The
          # stored URL still said `localhost` months after the database moved
          # into a container, and still named a role the volume did not have;
          # nothing could compare them because only one of the two was ever
          # read by the app. Derived here, they cannot disagree.
          #
          # The host is `postgres`, the compose service name, resolved on the
          # compose network. It is a fact about the topology rather than a
          # secret, so it belongs in the open where a reviewer can see it --
          # being hidden inside a secret is precisely how `localhost` survived
          # the move off bare metal.
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER_PROD }}:${{ secrets.POSTGRES_PASSWORD_PROD }}@postgres:5432/ticketing_saas
          CLERK_SECRET_KEY: ${{ secrets.PROD_CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API: ${{ secrets.PROD_CLERK_FRONTEND_API }}
          ENVIRONMENT: prod
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          MANAGER_EMAIL: ${{ vars.MANAGER_EMAIL }}
        run: ./deploy/render-env.sh backend/.env.example > /tmp/backend.env

      - name: Render the compose .env
        env:
          # The same contract as backend.env above: every key in the template
          # must have a non-empty value here, or the build fails naming the
          # ones that do not.
          #
          # This replaces a fixed heredoc, and the heredoc is how CRM_DB_USER
          # reached the test box as an empty string -- the GitHub variable was
          # never set, the heredoc wrote `CRM_DB_USER=` regardless, and nothing
          # reported it. Postgres reads that value exactly once, on a first `up`
          # against an empty volume, so prod gets a single chance at it: at
          # cutover, with no way to notice afterwards that it was blank.
          #
          # COMPOSE_FILE travels in this file so a bare `docker compose` in
          # ~/stack finds the stack. See deploy/compose.env.example.
          COMPOSE_FILE: docker-compose.prod.yml
          POSTGRES_USER: ${{ secrets.POSTGRES_USER_PROD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
          CRM_DB_USER: ${{ vars.CRM_DB_USER_PROD }}
          CRM_DB_PASSWORD: ${{ secrets.CRM_DB_PASSWORD_PROD }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
        run: ./deploy/render-env.sh deploy/compose.env.example > /tmp/compose.env

      - name: Assemble the stack directory
        run: |
          mkdir -p /tmp/stack
          cp -r deploy/. /tmp/stack/
          # Proxy server-block templates. deploy.sh substitutes the hostnames
          # and decides whether the SSL blocks can be installed yet.
          cp -r proxy/deploy/conf.d /tmp/stack/proxy-templates
          mv /tmp/backend.env /tmp/stack/backend.env
          # Compose reads .env by default, which is what lets deploy.sh and a
          # human in ~/stack run the identical bare `docker compose`.
          mv /tmp/compose.env /tmp/stack/.env
          chmod 600 /tmp/stack/backend.env /tmp/stack/.env
          chmod +x /tmp/stack/*.sh /tmp/stack/postgres-init/*.sh

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Copy the stack to the box
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }} "mkdir -p ~/stack"
          scp -o StrictHostKeyChecking=no -r /tmp/stack/. \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }}:~/stack/

      # A SEPARATE STEP, AND IT HAS TO STAY ONE.
      #
      # Installs Docker if the box has none. It cannot be chained ahead of the
      # docker login below, because bootstrap.sh adds the deploy user to the
      # `docker` group and group membership is resolved at login -- the session
      # that ran usermod does not have it. Same ssh call would install Docker
      # and then fail on the socket. A new step is a new session.
      - name: Prepare the box
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }} "
            bash ~/stack/bootstrap.sh '${{ vars.EC2_USER }}'
          "

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.EC2_USER }}@${{ vars.EC2_HOST_PROD }} "
            set -e
            # A read-only token: this box pulls images, it never publishes them.
            echo '${{ secrets.GHCR_PULL_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            API_DOMAIN=\$(echo '${{ vars.PROD_API_URL }}' | sed -E 's#^https?://##; s#/.*##')
            bash ~/stack/deploy.sh '${{ vars.PROD_DOMAIN }}' \"\$API_DOMAIN\" '${{ vars.CERTBOT_EMAIL }}'
          "

      - name: Smoke test
        run: |
          # Through the real hostname, so this exercises Cloudflare, the proxy
          # and the backend rather than proving a container merely started.
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ vars.PROD_DOMAIN }}/health"; then
              echo " <- prod healthy"; exit 0
            fi
            sleep 6
          done
          echo "health check never passed" >&2; exit 1
