# Shared reverse proxy -- LOCAL DEVELOPMENT.
#
# The production counterpart lives in proxy/deploy/conf.d/. This one is plain
# HTTP on one hostname-agnostic server block, so the stack is reachable at
# http://localhost:8080 without certificates. Everything else about the shape
# -- same-origin routing, runtime DNS, the upstream names -- matches
# production deliberately, so what works here works there.

# Docker's embedded DNS. Required for the runtime resolution below.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    # UPSTREAMS ARE RESOLVED AT REQUEST TIME, NOT AT STARTUP.
    #
    # An `upstream` block, or a literal hostname in proxy_pass, is resolved
    # once when nginx loads its configuration and then cached for the life of
    # the process. Recreating a backend container gives it a new IP, and this
    # proxy would go on dialling the old one -- every request 502 until
    # somebody restarted nginx. A redeploy becoming an outage, for no reason.
    #
    # Putting the address in a variable forces nginx to consult the resolver
    # per request instead. The cost is one cached DNS lookup every 10 seconds.
    #
    # With a variable, nginx no longer rewrites the URI the way a trailing
    # slash normally would, so $request_uri is appended explicitly. Both paths
    # map one-to-one anyway: /api/tickets/ reaches the backend unchanged.

    location /api/ {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Not under /api, so it is reached directly rather than through the
    # routers. Useful for confirming the backend is up without a Clerk token.
    location = /health {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;
    }

    location / {
        set $ticketing_frontend http://ticketing-frontend:80;
        proxy_pass $ticketing_frontend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
