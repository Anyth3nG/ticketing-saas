# The old API hostname on port 443. Installed by deploy.sh only when this
# environment still has one (deploy.sh's second argument is not `none`) AND its
# certificate exists -- nginx will not start if a named certificate file is
# missing.
#
# Split out of ticketing-ssl.conf on 2026-09-10, when test handed its legacy
# hostname, api-testing, to the CRM. Prod still serves api-workload.
#
# This block may not claim default_server; 000-default.conf owns it. The
# resolver it relies on is in resolver.conf.
#
# __API_DOMAIN__ is substituted at deploy time.

# api-workload / api-testing were the API's own origin while the frontend lived
# on S3. Nothing new points here, but a browser still holding a bundle from the
# previous deploy does -- that bundle has the absolute URL compiled into it.
# Keeping this block means those sessions keep working instead of breaking
# until someone hard-refreshes.
#
# Retire it once the S3 buckets are gone and no such bundle can survive.
server {
    listen 443 ssl;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;

    location / {
        set $ticketing_backend http://backend:8000;
        proxy_pass $ticketing_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
