# The CRM's hostname on port 443. Installed by deploy.sh ONLY once a
# certificate for __CRM_DOMAIN__ exists -- nginx will not start if a named
# ssl_certificate file is missing. The :80 half, and why it stays, is
# crm-http.conf.
#
# Added 2026-10-20. Before it, this box terminated TLS for no hostname at all:
# the only :443 block was 000-default.conf's ssl_reject_handshake, so
# Cloudflare had to stay in Flexible mode and reach the origin over plain
# HTTP -- carrying the firm's client list, which by then was loaded in prod.
#
# A PASS-THROUGH, NOT A COPY OF ticketing-ssl.conf. The CRM is its own compose
# project with its own nginx, and everything CRM-specific -- /api routing, the
# SPA fallback, upload limits -- lives in that repo's crm.conf. This block
# only terminates TLS and hands the request across, exactly as the :80 half
# does. Resist adding location blocks here: two files would then decide the
# CRM's routing, in two repos, and only one of them would be obvious.
#
# This block may not claim default_server; 000-default.conf owns it. The
# resolver it relies on is in resolver.conf -- it is an http-level setting
# nginx accepts exactly once, so this file must not declare its own.
#
# __CRM_DOMAIN__ is substituted at deploy time.

server {
    listen 443 ssl;
    server_name __CRM_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__CRM_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CRM_DOMAIN__/privkey.pem;

    # At least the CRM's own limit (client_max_body_size in its crm.conf,
    # MAX_UPLOAD_BYTES in its app). nginx's 1m default would reject document
    # uploads HERE with a 413, before the CRM ever saw them. The same value is
    # in the :80 half; whichever proxy is tighter is the one that applies.
    client_max_body_size 25m;

    # Needed on :443 as well as :80 -- Cloudflare's Always Use HTTPS redirects
    # the challenge here, and without this location it would be proxied into
    # the CRM's SPA. See ticketing-ssl.conf for the full reasoning.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # UPSTREAM RESOLVED AT REQUEST TIME, NOT AT STARTUP.
    #
    # A literal hostname in proxy_pass -- or an `upstream` block -- is resolved
    # once when nginx loads its config and cached for the life of the process.
    # Recreating the CRM's proxy gives it a new IP, and this block would go on
    # dialling the old one: every request 502 until somebody restarted nginx.
    # A redeploy of the OTHER stack silently becoming an outage here.
    #
    # A variable forces a lookup through the resolver per request instead. With
    # a variable nginx stops rewriting the URI the way a trailing slash would,
    # so $request_uri is appended explicitly.
    #
    # `crm-proxy` is the alias the CRM's compose file gives its proxy on the
    # max-cpa-edge network. Not the CRM's own network -- both apps call their
    # services `backend` and `frontend`, and a proxy attached to both would
    # resolve those names to either app. Not 127.0.0.1:8082 either: a port
    # published on the host's loopback is unreachable from inside a container.
    location / {
        set $crm_proxy http://crm-proxy:80;
        proxy_pass $crm_proxy$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # https here, where the :80 half sends http. The hop onward to
        # crm-proxy is plain HTTP either way -- it crosses a Docker network on
        # one host -- so the CRM's backend still sees http on its own
        # X-Forwarded-Proto, set by the inner nginx. Nothing in the CRM reads
        # it today (no cookies, no absolute URLs); do not build something that
        # does without fixing the inner hop too.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Same values as the :80 half and the CRM's crm.conf. Uploads and
        # downloads cross both proxies.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}
