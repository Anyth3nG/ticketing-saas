# The CRM's hostname, handed across to the CRM's own proxy. Installed by
# deploy.sh only when it is given a CRM hostname -- on test that is
# api-testing.max-cpa.co.il. Prod passes none; the CRM does not run there yet.
#
# ONE FRONT DOOR, TWO STACKS. Only one container can hold the host's :80, and
# this proxy holds it. The CRM is still its own compose project -- own
# Postgres, own nginx, own deploy -- and this block does nothing but pass its
# hostname through, untouched, to that nginx. Everything CRM-specific, /api
# routing included, stays in the CRM repo's crm.conf.
#
# REACHED OVER `max-cpa-edge`, an external Docker network holding ONLY the two
# proxies. Not the CRM's own network: both apps name their services `backend`
# and `frontend`, and a proxy attached to both apps' networks would resolve
# `backend` to either one. On max-cpa-edge neither name exists, so
# `crm-proxy` -- the alias the CRM's compose file gives its proxy there -- is
# the only thing this block can reach.
#
# Not the CRM's 127.0.0.1:8082 either: a port published on the host's loopback
# is not reachable from inside another container.
#
# If the CRM stack is down, `crm-proxy` does not resolve and this hostname
# returns 502. Ticketing is unaffected: resolution happens per request, so this
# proxy starts and serves its own app whether the CRM exists or not.
#
# :80 ONLY. There is no certificate for this hostname, which is fine while
# Cloudflare reaches it in Flexible mode. Flipped to Full, its requests would
# land on 000-default.conf's :443 block and have the handshake refused (a
# Cloudflare 525) -- so it needs a certificate and a :443 twin first.
#
# __CRM_DOMAIN__ is substituted at deploy time.

server {
    listen 80;
    server_name __CRM_DOMAIN__;

    # At least the CRM's own limit (client_max_body_size in its crm.conf,
    # MAX_UPLOAD_BYTES in its app). nginx's 1m default would reject document
    # uploads HERE with a 413, before the CRM ever saw them.
    client_max_body_size 25m;

    location / {
        set $crm_proxy http://crm-proxy:80;
        proxy_pass $crm_proxy$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Same values as crm.conf. Uploads and downloads cross both proxies,
        # and whichever is tighter is the one that applies.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}
