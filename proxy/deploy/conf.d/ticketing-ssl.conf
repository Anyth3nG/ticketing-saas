# ticketing-saas on port 443. Installed by deploy.sh ONLY once a certificate
# for __DOMAIN__ exists -- nginx will not start if a named certificate file is
# missing. See ticketing-http.conf for why the split exists.
#
# This block may not claim default_server; 000-default.conf owns it. The
# resolver it relies on is in resolver.conf, and the legacy API hostname's :443
# block is in ticketing-legacy-api-ssl.conf -- separate, because not every
# environment still has one.
#
# __DOMAIN__ is substituted at deploy time.

# --- The application, same origin -----------------------------------------
#
# ONE hostname serves both the SPA and the API. That is precisely why the
# backend carries no CORS middleware and the bundle carries no API base URL:
# there is no second origin for either to describe.
server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # UPSTREAMS ARE RESOLVED AT REQUEST TIME, NOT AT STARTUP.
    #
    # A literal hostname in proxy_pass -- or an `upstream` block -- is resolved
    # once when nginx loads its config and cached for the life of the process.
    # Recreating a backend container gives it a new IP, and this proxy would go
    # on dialling the old one: every request 502 until somebody restarted
    # nginx. A redeploy silently becoming an outage.
    #
    # A variable forces a lookup through the resolver per request instead. With
    # a variable nginx stops rewriting the URI the way a trailing slash would,
    # so $request_uri is appended explicitly.
    location /api/ {
        set $ticketing_backend http://backend:8000;
        proxy_pass $ticketing_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $ticketing_backend http://backend:8000;
        proxy_pass $ticketing_backend$request_uri;
    }

    location / {
        set $ticketing_frontend http://frontend:80;
        proxy_pass $ticketing_frontend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
