# ticketing-saas on port 443. Installed by deploy.sh ONLY once certificates
# for both hostnames exist -- nginx will not start if a named certificate file
# is missing. See ticketing-http.conf for why the split exists.
#
# Neither block may claim default_server; 000-default.conf owns it.
#
# __DOMAIN__ and __API_DOMAIN__ are substituted at deploy time.

resolver 127.0.0.11 valid=10s ipv6=off;

# --- The application, same origin -----------------------------------------
#
# ONE hostname serves both the SPA and the API. That is precisely why the
# backend carries no CORS middleware and the bundle carries no API base URL:
# there is no second origin for either to describe.
server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # UPSTREAMS ARE RESOLVED AT REQUEST TIME, NOT AT STARTUP.
    #
    # A literal hostname in proxy_pass -- or an `upstream` block -- is resolved
    # once when nginx loads its config and cached for the life of the process.
    # Recreating a backend container gives it a new IP, and this proxy would go
    # on dialling the old one: every request 502 until somebody restarted
    # nginx. A redeploy silently becoming an outage.
    #
    # A variable forces a lookup through the resolver per request instead. With
    # a variable nginx stops rewriting the URI the way a trailing slash would,
    # so $request_uri is appended explicitly.
    location /api/ {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;
    }

    location / {
        set $ticketing_frontend http://ticketing-frontend:80;
        proxy_pass $ticketing_frontend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- The old API hostname, kept through the transition ---------------------
#
# api-workload / api-testing were the API's own origin while the frontend lived
# on S3. Nothing new points here, but a browser still holding a bundle from the
# previous deploy does -- that bundle has the absolute URL compiled into it.
# Keeping this block means those sessions keep working instead of breaking
# until someone hard-refreshes.
#
# Retire it once the S3 buckets are gone and no such bundle can survive.
server {
    listen 443 ssl;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;

    location / {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
