# ticketing-saas on port 80. ALWAYS installed.
#
# Split from the :443 blocks (ticketing-ssl.conf) on purpose: nginx refuses to
# start if a server block names a certificate file that does not exist, so on a
# first deploy -- before certbot has ever run -- the SSL config cannot be
# present. But certbot's http-01 challenge needs a running nginx to serve it.
#
# This file breaks that circle. It is installed unconditionally, serves the
# challenge, and deploy.sh adds the SSL blocks only once the certificates
# actually exist. Same approach the old host-nginx script took, kept because
# it already worked here.
#
# __DOMAIN__ and __API_DOMAIN__ are substituted at deploy time.

resolver 127.0.0.11 valid=10s ipv6=off;

# Port 80 deliberately does NOT redirect to 443. Cloudflare hits the origin on
# :80 in Flexible mode and :443 in Full, and this origin works under either
# without needing to know which is set -- the property that makes flipping
# __DOMAIN__ from Flexible to Full a non-event rather than a coordinated
# cutover.
server {
    listen 80;
    server_name __DOMAIN__ __API_DOMAIN__;

    # CERTBOT RUNS ON THE HOST, BUT THIS CONTAINER OWNS :80.
    #
    # That rules out both of certbot's usual authenticators: --nginx wants to
    # edit an nginx it cannot see, --standalone wants to bind a port it cannot
    # have. --webroot is what works: certbot writes the challenge file into a
    # directory bind-mounted into this container, and nginx serves it.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $ticketing_backend http://ticketing-backend:8000;
        proxy_pass $ticketing_backend$request_uri;
    }

    location / {
        set $ticketing_frontend http://ticketing-frontend:80;
        proxy_pass $ticketing_frontend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
