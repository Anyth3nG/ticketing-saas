# Docker's embedded DNS, for the request-time upstream resolution every server
# block in this directory relies on (see ticketing-http.conf for why).
#
# ITS OWN FILE BECAUSE nginx ACCEPTS IT ONCE. `resolver` at the http level is a
# single setting, and a second copy anywhere in conf.d is a hard error:
#
#   [emerg] "resolver" directive is duplicate
#
# ticketing-http.conf and ticketing-ssl.conf used to carry one each. That never
# surfaced only because the SSL file had never been installed anywhere: the
# first deploy to find a certificate would have failed `nginx -t`, and left on
# disk a config the proxy could not restart with. Found 2026-09-10 by running
# the two together through `nginx -t`.
#
# deploy.sh copies this file unconditionally. No other file here may declare a
# resolver.
resolver 127.0.0.11 valid=10s ipv6=off;
