# Catch-all for requests whose Host matches no server block: direct hits on
# the bare Elastic IP (which bypass Cloudflare entirely) and the constant
# background of vulnerability scanners probing by address. 444 closes the
# connection with no response, so none of it ever reaches an application.
#
# Ported unchanged in intent from backend/deploy/nginx_default.conf, which
# configured this on the HOST nginx before the proxy was containerized.
#
# THIS FILE OWNS default_server, AND NOTHING ELSE MAY CLAIM IT. nginx refuses
# to start with two default_server blocks on the same address:port. Nothing
# else claims it today -- the CRM became a separate compose project with its
# own nginx on 2026-09-07, so its `listen 80 default_server` is alone in its
# own container and collides with nothing here. That keyword, and the `_` in
# its server_name, both have to go if the two are ever merged behind this
# proxy. The filename is prefixed 000- so it sorts first and the constraint is
# obvious to whoever adds the next app.
#
# The 000- prefix is ordering only -- nginx matches by server_name, not by
# file order, so an unmatched Host lands here regardless.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    # Refuse the TLS handshake outright, so this block needs no certificate of
    # its own (nginx >= 1.19.4). Cloudflare in Full mode sends SNI for the real
    # hostname, which matches a named block and never lands here.
    ssl_reject_handshake on;
}
