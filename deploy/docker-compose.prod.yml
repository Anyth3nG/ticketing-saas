# Deployed stack (test and prod). Runs on the EC2 box; images are PULLED from
# GHCR, never built here -- the instance is small and stops nightly, and a
# build on it would be both slow and a second place for the result to differ
# from what CI tested.
#
# Lives alongside a rendered backend.env and a rendered proxy conf.d, both
# produced by CI and copied over. See deploy.sh.
#
# TICKETING ONLY, AND THE NAME SAYS SO. This file used to reserve a place for
# the CRM -- same Postgres engine, same proxy, one compose project -- and was
# named `maxcpa` after the box rather than the app for exactly that reason.
# Decided 2026-09-07 that the CRM gets its own compose project, with its own
# Postgres and its own nginx, so the name now describes what actually runs.
#
# Only one container can bind the host's :80 and :443, and this proxy holds
# both. A second stack on this box publishes its entry point on another port
# (loopback-only unless it is meant to be public).
#
# IF THE TWO ARE EVER MERGED behind one proxy, note that `backend` and
# `frontend` below are service names, and service names are DNS aliases on a
# shared network. The CRM uses those same two names, so one side has to be
# prefixed before either can resolve the other.

name: ticketing

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticketing_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # THIS DOES NOT CHECK CREDENTIALS. pg_isready never authenticates -- it
      # only asks whether the server is accepting connections, and reports
      # healthy against a role that does not exist. A wrong POSTGRES_USER went
      # unnoticed for a day behind a green healthcheck while the backend
      # crash-looped. Read this as "postgres is listening", never as "the
      # credentials work".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ticketing_saas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - backend.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # The Clerk publishable key is already baked into this image; there is
    # nothing to configure at runtime.
    image: ${FRONTEND_IMAGE}
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy-conf.d:/etc/nginx/conf.d:ro
      # Certbot runs on the HOST and writes here; nginx only reads. Read-only
      # is deliberate -- nothing in this container should be able to alter a
      # certificate.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # The ACME http-01 challenge directory, shared with host certbot. The
      # proxy owns :80, so certbot cannot use --standalone or --nginx; it
      # writes challenge files into this directory and nginx serves them.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
