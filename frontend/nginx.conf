# Serves the built SPA inside the frontend container. The shared proxy in
# front of it owns hostnames, TLS and /api routing; this block only has to
# hand back files.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space, so any path that is not a real file has
    # to return index.html rather than 404. This is the container equivalent of
    # the S3 error-document setting the old hosting needed for the same reason.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is what points at the hashed bundles,
    # so a cached copy pins a browser to the previous deploy indefinitely.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
